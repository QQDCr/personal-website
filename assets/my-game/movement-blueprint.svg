<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>GDScript movement logic diagram</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7595af" stroke-opacity=".14"/></pattern><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#6ccdbd"/></marker></defs><rect width="1200" height="680" fill="#0f2134"/><rect width="1200" height="680" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#e6edf3"><text x="45" y="50" font-size="28" fill="#e6edf3">01 / MOVEMENT BLUEPRINT</text><text x="45" y="82" font-size="17" fill="#adbdcd">Code-derived diagram · scenes/player.gd · not Unreal visual scripting</text><rect x="45" y="125" width="300" height="125" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="65" y="157" font-size="21" fill="#91e7d4">Physics frame</text><text x="65" y="190" font-size="17" fill="#e6edf3">On floor? Reset jump_count</text><text x="65" y="215" font-size="17" fill="#e6edf3">Read gravity and input</text><rect x="440" y="125" width="320" height="125" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="460" y="157" font-size="21" fill="#91e7d4">Jump eligibility</text><text x="460" y="190" font-size="17" fill="#e6edf3">Jump pressed + count &lt; 2</text><text x="460" y="215" font-size="17" fill="#e6edf3">count += 1; velocity.y = -300</text><rect x="855" y="125" width="300" height="125" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="875" y="157" font-size="21" fill="#91e7d4">Glide condition</text><text x="875" y="190" font-size="17" fill="#e6edf3">Airborne + has jumped</text><text x="875" y="215" font-size="17" fill="#e6edf3">Hold Down arrow</text><path d="M345 185 L440 185" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 185 L855 185" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><rect x="855" y="330" width="300" height="125" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="875" y="362" font-size="21" fill="#91e7d4">Apply glide modifiers</text><text x="875" y="395" font-size="17" fill="#e6edf3">Gravity × 0.15</text><text x="875" y="420" font-size="17" fill="#e6edf3">Horizontal speed × 1.5</text><rect x="440" y="330" width="320" height="125" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="460" y="362" font-size="21" fill="#91e7d4">Horizontal movement</text><text x="460" y="395" font-size="17" fill="#e6edf3">Input axis × speed</text><text x="460" y="420" font-size="17" fill="#e6edf3">Base speed: 150 px/s</text><rect x="45" y="330" width="300" height="125" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="65" y="362" font-size="21" fill="#91e7d4">Move + feedback</text><text x="65" y="395" font-size="17" fill="#e6edf3">move_and_slide()</text><text x="65" y="420" font-size="17" fill="#e6edf3">Idle / run / jump animation</text><path d="M1005 250 L1005 330" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><path d="M855 395 L760 395" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 395 L345 395" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="535" font-size="19" fill="#91e7d4">WHY IT MATTERS</text><text x="45" y="574" font-size="22" fill="#e6edf3">A second jump corrects the route; gliding trades fall speed for horizontal reach.</text><text x="45" y="616" font-size="19" fill="#adbdcd">Spring contact assigns upward velocity only while the player is falling.</text></g></svg>