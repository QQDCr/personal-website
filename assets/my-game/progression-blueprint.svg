<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Score signals, gate unlock and checkpoint logic</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7595af" stroke-opacity=".14"/></pattern><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#6ccdbd"/></marker></defs><rect width="1200" height="680" fill="#0f2134"/><rect width="1200" height="680" fill="url(#grid)"/><g font-family="Arial,sans-serif" fill="#e6edf3"><text x="45" y="50" font-size="28" fill="#e6edf3">02 / PROGRESSION BLUEPRINT</text><text x="45" y="82" font-size="17" fill="#adbdcd">Source-backed signal flow · global_game_manager.gd / score_gate.gd / portal.gd</text><rect x="45" y="120" width="300" height="130" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="65" y="152" font-size="21" fill="#91e7d4">Coin body_entered</text><text x="65" y="185" font-size="17" fill="#e6edf3">Scene manager.add_point()</text><text x="65" y="210" font-size="17" fill="#e6edf3">Autoload score += 30</text><rect x="440" y="120" width="320" height="130" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="460" y="152" font-size="21" fill="#91e7d4">score_changed(score)</text><text x="460" y="185" font-size="17" fill="#e6edf3">HUD refreshes score text</text><text x="460" y="210" font-size="17" fill="#e6edf3">Gate checks required_score</text><rect x="855" y="120" width="300" height="130" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="875" y="152" font-size="21" fill="#91e7d4">Threshold reached?</text><text x="875" y="185" font-size="17" fill="#e6edf3">Only once: unlocked = true</text><text x="875" y="210" font-size="17" fill="#e6edf3">Remove collision + gate tiles</text><path d="M345 185 L440 185" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 185 L855 185" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="340" width="300" height="150" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="65" y="372" font-size="21" fill="#91e7d4">Checkpoint portal</text><text x="65" y="405" font-size="17" fill="#e6edf3">Set second gate to 900</text><text x="65" y="430" font-size="17" fill="#e6edf3">Reset score; save checkpoint</text><text x="65" y="455" font-size="17" fill="#e6edf3">Move to DestinationPoint</text><rect x="440" y="340" width="320" height="150" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="460" y="372" font-size="21" fill="#91e7d4">Death / scene reload</text><text x="460" y="405" font-size="17" fill="#e6edf3">Reset score; slow time</text><text x="460" y="430" font-size="17" fill="#e6edf3">Timer reloads current scene</text><text x="460" y="455" font-size="17" fill="#e6edf3">Restore normal time</text><rect x="855" y="340" width="300" height="150" rx="10" fill="#172e47" stroke="#6d9bb7"/><text x="875" y="372" font-size="21" fill="#91e7d4">Player._ready()</text><text x="875" y="405" font-size="17" fill="#e6edf3">If checkpoint exists:</text><text x="875" y="430" font-size="17" fill="#e6edf3">Restore position</text><text x="875" y="455" font-size="17" fill="#e6edf3">Reset velocity</text><path d="M345 415 L440 415" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 415 L855 415" fill="none" stroke="#6ccdbd" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="555" font-size="19" fill="#91e7d4">SCENE VALUES OVERRIDE SCRIPT DEFAULTS</text><text x="45" y="594" font-size="21" fill="#e6edf3">First gate: 900 points. Second gate: 9999 initially, then 900 after the portal.</text><text x="45" y="633" font-size="19" fill="#adbdcd">At 30 points per pickup, a 900-point gate requires 30 coin pickups.</text></g></svg>